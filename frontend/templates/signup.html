
<!DOCTYPE html>
<html>
<head>
<title>Pet Paradise</title>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" type="text/css" href="mystyle.css">
<style> 
#color{
	background-color:lightpink;
}
#padding{
	padding-left:500px
}
#top{
	padding-top:20px
}
</style>
<body id="padding" style="background-color:lightpink;">
<center>
<div class="container">
<div class="row">
<div class="col-6">
<h3 id="top">Sign in</h3>
<h3>Create Account</h3>
<p>Enter your details</p>
<form action="pre.php" method="post" onsubmit="return validate()" name="myform">
<label class="form-label">Username</label>
<input type="text" name="uname" placeholder="Username" class="form-control"><br>
<label class="form-label">Email</label>
<input type="email" name="email" placeholder="Enter your email address" class="form-control"><br>
<label class="form-label">password:</label>
<input type="password" name="pass" placeholder="Password" class="form-control"><br>
<label class="form-label">Comfirm password:</label>
<input type="password" name="pwd" placeholder="confirm password" class="form-control"><br>
<label class="form-label">Mobile number</label>
<input type="tel" name="mobile" placeholder="Phone number" class="form-control"><br>
<input type="submit" value="Submit">
</form>
</center>
<script>
function validate(){
	var username=document.myform.uname.value;
	if(username==""){
		alert("please enter username");
		return false;
	}
	var email=document.myform.email.value;
	if(email==="" || !(email.match(/[a-z A-Z 0-9 \. _ -]+[@][a-z A-Z 0-9 _ -]+[\.][a-z]{2,3}/))){
		alert("please enter valid email address");
		return false;
	}
	var password=document.myform.pass.value;
	var cpassword=document.myform.pwd.value;
	if(password.length<6){	
		alert("password must contain 6 characters");	
		return false;
	}
	else if(password!=cpassword){
		alert("password must equal to confirm password");
		return false;
	}
	
	var mobile=document.myform.mobile.value;
	if(mobile==="" || mobile.length!=10 || !(mobile.match(/[6-9][0-9]{9}/))){
		alert("please enter valid number");
		return false;
	}
}

</script>
</div>
</div>
</div>
</div>
</body>
</html>
